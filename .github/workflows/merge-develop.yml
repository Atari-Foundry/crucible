name: Merge develop to main

# This workflow automatically merges develop branch to main after successful CI
# Alternative approach: triggers directly on push to develop after CI succeeds

on:
  push:
    branches:
      - develop

jobs:
  wait-for-ci:
    name: Wait for CI to complete
    runs-on: ubuntu-latest
    steps:
    - name: Wait for CI
      uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.sha }}
        check-name: 'Build and Test'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 10

  merge-to-main:
    name: Merge to main
    needs: wait-for-ci
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Merge develop to main
      run: |
        git checkout main
        git pull origin main
        git merge develop --no-edit -m "Auto-merge from develop branch [skip ci]"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
