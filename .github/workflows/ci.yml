name: CI

# CI workflow for basic verification only
# All builds are done locally - see CONTRIBUTING.md for build instructions

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get update
          sudo apt-get install -y clang
        fi
    
    - name: Build
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          make CC=clang
        else
          make
        fi
    
    - name: Run tests
      run: make test
    
    - name: Check executable
      run: |
        ./build/crucible -h
        test -f build/crucible
