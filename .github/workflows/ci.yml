name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compiler: [gcc, clang]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          sudo apt-get update
          sudo apt-get install -y clang
        fi
    
    - name: Build
      run: |
        if [ "${{ matrix.compiler }}" = "clang" ]; then
          make CC=clang
        else
          make
        fi
    
    - name: Run tests
      run: make test
    
    - name: Check executable
      run: |
        ./build/crucible -h
        test -f build/crucible

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
    
    - name: Build
      run: |
        make CC=x86_64-w64-mingw32-gcc
    
    - name: Check executable
      run: |
        if (Test-Path build\crucible.exe) { Write-Host "Build successful" } else { exit 1 }

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build
      run: make
    
    - name: Run tests
      run: make test
    
    - name: Check executable
      run: |
        ./build/crucible -h
        test -f build/crucible
